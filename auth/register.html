<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0 5rem;">

  <div style="width: 100%; max-width: 440px; padding: 0 1rem;">
    
    <!-- Header Banner -->
    <div class="card-sinex-hero" style="text-align: center; margin-bottom: 1rem;">
      <h2 style="margin: 0 0 0.35rem 0; font-weight: 800; color: #ffffff;">Create SINEX Account</h2>
      <p style="margin: 0; font-size: 0.825rem; color: var(--sinex-text-muted);">Choose your account type and fill in your details to get started.</p>
    </div>

    <!-- Registration Card -->
    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <form id="signupForm">
        
        <!-- Account Type Selection -->
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; color: #ffffff;">Account Type</label>

          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
            <!-- User Option -->
            <label style="border: 1px solid var(--sinex-border); background: #0f172a; padding: 0.65rem; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: flex-start; gap: 0.5rem;">
              <input type="radio" name="account_role" value="USER" checked style="accent-color: var(--sinex-teal); margin-top: 0.15rem;">
              <div>
                <div style="font-size: 0.8rem; font-weight: 700; color: #ffffff;">User</div>
                <div style="font-size: 0.68rem; color: var(--sinex-text-muted);">Personal account</div>
              </div>
            </label>

            <!-- Client Option -->
            <label style="border: 1px solid var(--sinex-border); background: #0f172a; padding: 0.65rem; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: flex-start; gap: 0.5rem;">
              <input type="radio" name="account_role" value="CLIENT" style="accent-color: var(--sinex-teal); margin-top: 0.15rem;">
              <div>
                <div style="font-size: 0.8rem; font-weight: 700; color: #ffffff;">Client</div>
                <div style="font-size: 0.68rem; color: var(--sinex-text-muted);">Business & projects</div>
              </div>
            </label>

            <!-- Developer Option -->
            <label style="border: 1px solid var(--sinex-border); background: #0f172a; padding: 0.65rem; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: flex-start; gap: 0.5rem;">
              <input type="radio" name="account_role" value="DEVELOPER" style="accent-color: var(--sinex-teal); margin-top: 0.15rem;">
              <div>
                <div style="font-size: 0.8rem; font-weight: 700; color: #ffffff;">Developer</div>
                <div style="font-size: 0.68rem; color: var(--sinex-text-muted);">APIs & integrations</div>
              </div>
            </label>

            <!-- Investor Option -->
            <label style="border: 1px solid var(--sinex-border); background: #0f172a; padding: 0.65rem; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: flex-start; gap: 0.5rem;">
              <input type="radio" name="account_role" value="INVESTOR" style="accent-color: var(--sinex-teal); margin-top: 0.15rem;">
              <div>
                <div style="font-size: 0.8rem; font-weight: 700; color: #ffffff;">Investor</div>
                <div style="font-size: 0.68rem; color: var(--sinex-text-muted);">Funding & growth</div>
              </div>
            </label>
          </div>
        </div>

        <!-- Full Name -->
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Full Name</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">👤</span>
            <input type="text" id="registerFullName" class="sinex-input" placeholder="John Doe" required>
          </div>
        </div>

        <!-- Email Address -->
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Email Address</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">✉️</span>
            <input type="email" id="registerEmail" class="sinex-input" placeholder="name@example.com" required>
          </div>
        </div>

        <!-- Password -->
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Password</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">🔒</span>
            <input type="password" id="registerPassword" class="sinex-input" placeholder="Create strong password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="registerBtn" class="btn-sinex-primary">Continue to Verification →</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.825rem; color: var(--sinex-text-muted);">
        Already have an account? <a href="login.html" style="color: var(--sinex-teal); text-decoration: none; font-weight: 700;">Log In</a>
      </div>
    </div>

  </div>

  <script src="../assets/css/js/api.js"></script>
  <script>
    let activeCountryId = null;

    // Fetch a valid MongoDB Country ObjectId on page load
    async function loadCountry() {
      try {
        const response = await apiRequest('/countries', 'GET');
        if (response && response.success && Array.isArray(response.data) && response.data.length > 0) {
          activeCountryId = response.data[0]._id || response.data[0].id;
        }
      } catch (err) {
        console.error('Could not fetch countries:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadCountry);

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('registerBtn');
      const selectedRole = document.querySelector('input[name="account_role"]:checked').value;
      const fullName = document.getElementById('registerFullName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;

      // Save role locally in lowercase for frontend routing
      localStorage.setItem('sinex_user_role', selectedRole.toLowerCase());

      // Try fetching country ID if not yet available
      if (!activeCountryId) {
        await loadCountry();
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating Account...';

      const payload = {
        fullName: fullName,
        email: email,
        password: password,
        role: selectedRole.toUpperCase()
      };

      if (activeCountryId) {
        payload.countryId = activeCountryId;
      }

      const response = await apiRequest('/auth/register', 'POST', payload);

      submitBtn.disabled = false;
      submitBtn.innerText = 'Continue to Verification →';

      if (response && response.success) {
        if (response.data && response.data.accessToken) {
          localStorage.setItem('token', response.data.accessToken);
        }
        window.location.href = 'verify-account.html';
      } else {
        alert(response.message || 'Registration failed. Please check your inputs and try again.');
      }
    });
  </script>
</body>
</html>
