<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Code | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem 0 5rem;">

  <div style="width: 100%; max-width: 420px; padding: 0 1rem;">
    
    <!-- Header Banner -->
    <div class="card-sinex-hero" style="text-align: center; margin-bottom: 1rem;">
      <h2 style="margin: 0 0 0.35rem 0; font-weight: 800; color: #ffffff;">Enter Verification Code</h2>
      <p style="margin: 0; font-size: 0.825rem; color: var(--sinex-text-muted);">We sent a 6-digit code to your email/phone number.</p>
    </div>

    <!-- Verification Card -->
    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <form action="reset-password.html">
        
        <div style="margin-bottom: 1.5rem; text-align: center;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.75rem; color: #ffffff;">6-Digit OTP Code</label>
          
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
            <input type="text" maxlength="1" class="sinex-input" style="width: 48px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: 800; padding: 0;" required>
          </div>
        </div>

        <button type="submit" class="btn-sinex-primary">Verify & Proceed →</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.825rem; color: var(--sinex-text-muted);">
        Didn't receive the code? <a href="#" style="color: var(--sinex-teal); text-decoration: none; font-weight: 700;">Resend OTP</a>
      </div>
    </div>

  </div>
<script src="../assets/css/js/api.js"></script>
</body>
</html>
