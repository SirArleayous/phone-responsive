<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem 0 5rem;">

  <div style="width: 100%; max-width: 420px; padding: 0 1rem;">
    
    <!-- Header Banner -->
    <div class="card-sinex-hero" style="text-align: center; margin-bottom: 1rem;">
      <h2 style="margin: 0 0 0.35rem 0; font-weight: 800; color: #ffffff;">Reset Password</h2>
      <p style="margin: 0; font-size: 0.825rem; color: var(--sinex-text-muted);">Enter your registered email to receive a password recovery link.</p>
    </div>

    <!-- Card Container -->
    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <form action="verify-account.html">
        
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Email Address</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">✉️</span>
            <input type="email" class="sinex-input" placeholder="Enter your registered email" required>
          </div>
        </div>

        <!-- Guidance Card -->
        <div style="background: #0f172a; padding: 1rem; border-radius: var(--border-radius-md); border: 1px solid var(--sinex-border); margin-bottom: 1.25rem;">
          <div style="font-size: 0.8rem; font-weight: 700; color: var(--sinex-teal); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
            💡 Instructions
          </div>
          <p style="margin: 0; font-size: 0.775rem; color: var(--sinex-text-muted); line-height: 1.5;">
            We will send a 6-digit verification code to your email address. Make sure to check your Spam folder if you don't see it in your inbox.
          </p>
        </div>

        <button type="submit" class="btn-sinex-primary">Send Reset Code →</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.825rem; color: var(--sinex-text-muted);">
        Remembered your password? <a href="login.html" style="color: var(--sinex-teal); text-decoration: none; font-weight: 700;">Log In</a>
      </div>
    </div>

  </div>

</body>
</html>
