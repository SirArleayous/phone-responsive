<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem 0 5rem;">

  <div style="width: 100%; max-width: 420px; padding: 0 1rem;">
    
    <!-- Header Banner -->
    <div class="card-sinex-hero" style="text-align: center; margin-bottom: 1rem;">
      <h2 style="margin: 0 0 0.35rem 0; font-weight: 800; color: #ffffff;">Create New Password</h2>
      <p style="margin: 0; font-size: 0.825rem; color: var(--sinex-text-muted);">Ensure your new password is secure and easy to remember.</p>
    </div>

    <!-- Password Card -->
    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <form action="login.html">
        
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">New Password</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">🔒</span>
            <input type="password" class="sinex-input" placeholder="Enter new password" required>
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Confirm New Password</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.9rem;">🔑</span>
            <input type="password" class="sinex-input" placeholder="Re-enter new password" required>
          </div>
        </div>

        <!-- Checklist -->
        <div style="background: #0f172a; padding: 0.85rem; border-radius: var(--border-radius-md); border: 1px solid var(--sinex-border); margin-bottom: 1.25rem;">
          <div style="font-size: 0.775rem; color: var(--sinex-text-muted); line-height: 1.6;">
            • Minimum of 8 characters long<br>
            • Must contain at least one number or special character
          </div>
        </div>

        <button type="submit" class="btn-sinex-primary">Update Password →</button>
      </form>
    </div>

  </div>

</body>
</html>
