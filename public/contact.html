<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app-viewport">

  <header style="background: var(--sinex-card-bg); border-bottom: 1px solid var(--sinex-border); padding: 1rem 1.25rem;">
    <a href="index.html" style="text-decoration: none; font-size: 1.25rem; font-weight: 800; color: #ffffff;">
      SINEX <span class="badge-sinex" style="font-size: 0.65rem;">SUPPORT</span>
    </a>
  </header>

  <main style="padding: 1.5rem 1rem; max-width: 500px; margin: 0 auto;">
    
    <div class="card-sinex-hero">
      <h2 style="color: #fff; margin: 0 0 0.5rem 0; font-size: 1.25rem;">Get in Touch</h2>
      <p style="color: var(--sinex-text-muted); font-size: 0.85rem; margin: 0 0 1.25rem 0;">Have questions or need assistance with your payments? Send us a message.</p>

      <form action="#">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Your Name</label>
          <input type="text" class="sinex-input" style="padding-left: 1rem;" placeholder="Enter your full name" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Email Address</label>
          <input type="email" class="sinex-input" style="padding-left: 1rem;" placeholder="Enter your email" required>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; color: #ffffff;">Message</label>
          <textarea class="sinex-input" style="padding: 0.85rem; min-height: 100px; resize: vertical;" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-sinex-primary">Send Message →</button>
      </form>
    </div>

  </main>

  <nav class="mobile-bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span><span>Home</span>
    </a>
    <a href="earn.html" class="nav-item">
      <span>🎯</span><span>Earn</span>
    </a>
    <a href="../auth/register.html" class="nav-item active-fab">
      <span style="font-size: 1.25rem; color: #0a0f1d;">🚀</span>
    </a>
    <a href="businesses.html" class="nav-item">
      <span>🏢</span><span>Client</span>
    </a>
    <a href="../auth/login.html" class="nav-item">
      <span>🔑</span><span>Login</span>
    </a>
  </nav>

</div>
<script src="../assets/css/js/api.js"></script>
</body>
</html>
