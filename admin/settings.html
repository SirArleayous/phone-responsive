<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global System Settings | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Global Platform Settings</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Platform Maintenance Mode</label>
        <select class="sinex-input">
          <option value="disabled">Disabled (Normal Operations)</option>
          <option value="enabled">Enabled (System Maintenance)</option>
        </select>
      </div>

      <button class="btn-sinex-primary" style="width: auto;" onclick="alert('Global Settings Updated!');">Save Global Configurations</button>
    </div>
  </div>

</body>
</html>
