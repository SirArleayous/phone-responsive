<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Accounts | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Business / Client Accounts</h2>

    <div class="card-sinex-hero" style="padding: 1rem; overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
        <thead>
          <tr style="border-bottom: 1px solid var(--sinex-border); color: var(--sinex-text-muted);">
            <th style="padding: 0.75rem;">Company Name</th>
            <th style="padding: 0.75rem;">Escrow Balance</th>
            <th style="padding: 0.75rem;">Active Campaigns</th>
            <th style="padding: 0.75rem;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr style="border-bottom: 1px solid var(--sinex-border);">
            <td style="padding: 0.75rem; font-weight: 700;">HM Dembo Technologies</td>
            <td style="padding: 0.75rem; color: #10b981; font-weight: 700;">$1,450.00</td>
            <td style="padding: 0.75rem;">4 Active</td>
            <td style="padding: 0.75rem;"><a href="client-details.html" style="color: var(--sinex-teal); text-decoration: none; font-weight: 700;">Manage Account →</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
