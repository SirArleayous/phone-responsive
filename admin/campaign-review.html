<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Review | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Pending Campaign Approval</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h3 style="margin: 0 0 0.5rem 0;">Crypto Wallet Beta Signup</h3>
      <p style="margin: 0 0 1rem 0; font-size: 0.85rem; color: var(--sinex-text-muted);">Requested Payout: $3.00/user • Target: 500 users</p>

      <div style="display: flex; gap: 1rem;">
        <button class="btn-sinex-primary" style="padding: 0.5rem 1rem; width: auto;" onclick="alert('Campaign approved!');">Approve & Publish</button>
        <button style="background: #ef4444; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; font-weight: 700; cursor: pointer;">Reject Campaign</button>
      </div>
    </div>
  </div>

</body>
</html>
