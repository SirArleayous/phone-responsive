<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
      <h2 style="margin: 0; font-size: 1.25rem; font-weight: 800;">User Directory</h2>
      <input type="text" class="sinex-input" placeholder="Search by name, email, or ID..." style="max-width: 300px;">
    </div>

    <div class="card-sinex-hero" style="padding: 1rem; overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
        <thead>
          <tr style="border-bottom: 1px solid var(--sinex-border); color: var(--sinex-text-muted);">
            <th style="padding: 0.75rem;">User ID</th>
            <th style="padding: 0.75rem;">Name</th>
            <th style="padding: 0.75rem;">Email</th>
            <th style="padding: 0.75rem;">Earnings</th>
            <th style="padding: 0.75rem;">Status</th>
            <th style="padding: 0.75rem;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr style="border-bottom: 1px solid var(--sinex-border);">
            <td style="padding: 0.75rem; font-weight: 700;">#USR-1092</td>
            <td style="padding: 0.75rem;">Khadija Usman</td>
            <td style="padding: 0.75rem;">khadija@example.com</td>
            <td style="padding: 0.75rem; color: #10b981; font-weight: 700;">$340.50</td>
            <td style="padding: 0.75rem;"><span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700;">ACTIVE</span></td>
            <td style="padding: 0.75rem;"><a href="user-details.html" style="color: var(--sinex-teal); text-decoration: none; font-weight: 700;">Inspect →</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
