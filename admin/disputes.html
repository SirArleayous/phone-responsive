<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispute Resolution | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Task Dispute Arbitrator</h2>

    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <div style="font-weight: 700; margin-bottom: 0.5rem;">Dispute #DSP-8812</div>
      <p style="font-size: 0.8rem; color: var(--sinex-text-muted); margin-bottom: 1rem;">Client rejected task proof claiming invalid email, but user provided screenshot confirmation.</p>

      <div style="display: flex; gap: 0.75rem;">
        <button class="btn-sinex-primary" style="width: auto; padding: 0.4rem 1rem; font-size: 0.8rem;" onclick="alert('Ruled in favor of User');">Rule for Worker</button>
        <button style="background: #ef4444; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 4px; font-weight: 700; font-size: 0.8rem; cursor: pointer;" onclick="alert('Ruled in favor of Client');">Rule for Client</button>
      </div>
    </div>
  </div>

</body>
</html>
