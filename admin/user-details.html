<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Detail View | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="users.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Users</a>

    <div class="card-sinex-hero" style="padding: 1.5rem; margin-bottom: 1.25rem;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
        <div>
          <h2 style="margin: 0;">Khadija Usman</h2>
          <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">User ID: #USR-1092 • Joined: Jan 12, 2026</div>
        </div>
        <button style="background: #ef4444; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-weight: 700; cursor: pointer;">Suspend User</button>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; border-top: 1px solid var(--sinex-border); padding-top: 1rem;">
        <div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Total Earned</div>
          <div style="font-size: 1.25rem; font-weight: 800; color: #10b981;">$340.50</div>
        </div>
        <div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Completed Tasks</div>
          <div style="font-size: 1.25rem; font-weight: 800;">128 Tasks</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
