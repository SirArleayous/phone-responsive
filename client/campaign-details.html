<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Details | SINEX Client</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="campaigns.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Campaigns</a>

    <div class="card-sinex-hero" style="padding: 1.5rem; margin-bottom: 1.25rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">ACTIVE</span>
        <button style="background: #ef4444; color: #fff; border: none; padding: 0.35rem 0.75rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer;">Pause Campaign</button>
      </div>
      <h2 style="margin: 0 0 0.5rem 0;">Fintech Mobile App Testing</h2>
      <p style="margin: 0; font-size: 0.85rem; color: var(--sinex-text-muted);">Allocated Escrow: $1,000.00 • Remaining: $290.00</p>
    </div>

    <!-- Submissions Summary -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
      <a href="tasks.html" class="card-sinex-hero" style="padding: 1.25rem; text-decoration: none; color: #fff;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Pending Review</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #eab308;">18 Submissions →</div>
      </a>
      <a href="results.html" class="card-sinex-hero" style="padding: 1.25rem; text-decoration: none; color: #fff;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Approved & Paid</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #10b981;">142 Submissions →</div>
      </a>
    </div>
  </div>

</body>
</html>
