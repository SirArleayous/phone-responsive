<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | SINEX Client</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1000px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Campaign Analytics</h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
      <div class="card-sinex-hero" style="padding: 1.25rem;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Total Impressions</div>
        <div style="font-size: 1.5rem; font-weight: 800;">14,250</div>
      </div>
      <div class="card-sinex-hero" style="padding: 1.25rem;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Conversion Rate</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #10b981;">18.4%</div>
      </div>
    </div>
  </div>

</body>
</html>
