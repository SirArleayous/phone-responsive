<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Campaign | SINEX Client</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="campaigns.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Campaigns</a>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h2 style="margin: 0 0 1rem 0; font-size: 1.25rem;">Create New Campaign</h2>

      <form action="campaigns.html">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Campaign Title</label>
          <input type="text" class="sinex-input" placeholder="e.g. Beta Testing App Launch" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Category</label>
          <select class="sinex-input" required>
            <option value="app_test">App Testing & Feedback</option>
            <option value="survey">Market Research / Survey</option>
            <option value="social">Social Engagement</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Reward Per User ($)</label>
            <input type="number" step="0.5" class="sinex-input" placeholder="5.00" required>
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Total Participants</label>
            <input type="number" class="sinex-input" placeholder="100" required>
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Step-by-Step Instructions</label>
          <textarea class="sinex-input" rows="4" placeholder="Detail exactly what the user must do and submit as proof..." required></textarea>
        </div>

        <button type="submit" class="btn-sinex-primary">Fund Escrow & Launch Campaign →</button>
      </form>
    </div>
  </div>

</body>
</html>
