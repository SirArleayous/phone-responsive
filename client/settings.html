<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Settings | SINEX Client</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem;">
    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem;">Company Profile & Settings</h2>

      <form action="dashboard.html" onsubmit="alert('Settings updated!');">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Company Name</label>
          <input type="text" class="sinex-input" value="SirArleayous Innovation Nexus Ltd" required>
        </div>

        <button type="submit" class="btn-sinex-primary">Save Changes →</button>
      </form>
    </div>
  </div>

</body>
</html>
