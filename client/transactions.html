<!DOCTYPE html>
<html lang="en">
<head>

  <title>Billing History | SINEX Client</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1000px; margin: 0 auto; padding: 1.25rem 1rem;">

    <div style="display: grid; gap: 0.75rem;">

        </div>
      </div>

      <div class="card-sinex-hero" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-weight: 700; font-size: 0.9rem;">Escrow Lock - Fintech App Testing</div>
