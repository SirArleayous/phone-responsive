<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Support | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem;">
    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h2 style="margin: 0 0 0.5rem 0; font-size: 1.25rem;">Enterprise Support</h2>
      <p style="margin: 0 0 1.25rem 0; font-size: 0.8rem; color: var(--sinex-text-muted);">Direct line to your account manager.</p>

      <form action="dashboard.html" onsubmit="alert('Support query submitted!');">
        <input type="text" class="sinex-input" placeholder="Subject" style="margin-bottom: 1rem;" required>
        <textarea class="sinex-input" rows="4" placeholder="How can we assist your campaign?" style="margin-bottom: 1.25rem;" required></textarea>
        <button type="submit" class="btn-sinex-primary">Send Message →</button>
      </form>
    </div>
  </div>

</body>
</html>
