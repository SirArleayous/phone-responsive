<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referrals | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Referral Program</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem; text-align: center; margin-bottom: 1.25rem;">
      <h3 style="margin: 0 0 0.5rem 0;">Invite Friends & Earn Rewards</h3>
      <p style="margin: 0 0 1.25rem 0; font-size: 0.85rem; color: var(--sinex-text-muted);">Get 10% commission on all completed tasks by users registered with your link.</p>

      <div style="background: #0f172a; padding: 0.75rem; border-radius: 8px; border: 1px dashed var(--sinex-border); display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 0.85rem; font-family: monospace; color: var(--sinex-teal);">https://sinex.com/signup?ref=USER123</span>
        <button class="btn-sinex-primary" style="padding: 0.35rem 0.75rem; font-size: 0.75rem; width: auto;" onclick="alert('Link copied!')">Copy</button>
      </div>
    </div>

    <!-- Stats -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="card-sinex-hero" style="padding: 1.25rem; text-align: center;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Total Referred</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #fff;">12</div>
      </div>
      <div class="card-sinex-hero" style="padding: 1.25rem; text-align: center;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Total Earned</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #10b981;">$32.00</div>
      </div>
    </div>
  </div>

</body>
</html>
