<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Account Profile</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem; text-align: center; margin-bottom: 1.25rem;">
      <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--sinex-teal); color: #000; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; margin: 0 auto 0.75rem auto;">JD</div>
      <h3 style="margin: 0 0 0.25rem 0;">John Doe</h3>
      <p style="margin: 0 0 1rem 0; font-size: 0.8rem; color: var(--sinex-text-muted);">john.doe@example.com</p>
      <a href="verification.html" style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; text-decoration: none; font-weight: 700;">Verified Account ✓</a>
    </div>

    <!-- Quick Links -->
    <div class="card-sinex-hero" style="padding: 1rem;">
      <div style="display: grid; gap: 0.75rem;">
        <a href="verification.html" style="display: flex; justify-content: space-between; color: #fff; text-decoration: none; padding: 0.5rem 0; border-bottom: 1px solid var(--sinex-border); font-size: 0.85rem;">Identity Verification (KYC) <span>→</span></a>
        <a href="settings.html" style="display: flex; justify-content: space-between; color: #fff; text-decoration: none; padding: 0.5rem 0; border-bottom: 1px solid var(--sinex-border); font-size: 0.85rem;">Account Settings <span>→</span></a>
        <a href="support.html" style="display: flex; justify-content: space-between; color: #fff; text-decoration: none; padding: 0.5rem 0; border-bottom: 1px solid var(--sinex-border); font-size: 0.85rem;">Help & Support <span>→</span></a>
        <a href="../auth/login.html" style="color: #ef4444; text-decoration: none; padding: 0.5rem 0; font-size: 0.85rem; font-weight: 700;">Log Out</a>
      </div>
    </div>
  </div>

  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 1px solid var(--sinex-border); padding: 0.75rem 0; display: flex; justify-content: space-around; z-index: 100;">
    <a href="dashboard.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">🏠<br>Home</a>
    <a href="tasks.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">📋<br>Tasks</a>

    <a href="profile.html" style="color: var(--sinex-teal); text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: 700;">👤<br>Profile</a>
  </nav>
