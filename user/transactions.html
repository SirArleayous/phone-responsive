<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Transaction History</h2>

    <div style="display: grid; gap: 0.75rem;">
      <div class="card-sinex-hero" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-weight: 700; font-size: 0.9rem;">Task Payout - Consumer Survey</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Sep 24, 2026 • Credit</div>
        </div>
        <div style="text-align: right;">
          <div style="font-weight: 800; color: #10b981;">+$2.00</div>
          <span style="font-size: 0.7rem; color: #10b981;">Completed</span>
        </div>
      </div>

      <div class="card-sinex-hero" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-weight: 700; font-size: 0.9rem;">Bank Withdrawal</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Sep 20, 2026 • Debit</div>
        </div>
        <div style="text-align: right;">
          <div style="font-weight: 800; color: #ef4444;">-$50.00</div>
          <span style="font-size: 0.7rem; color: #10b981;">Processed</span>
        </div>
      </div>
    </div>
  </div>
<script src="../assets/js/main.js"></script>
</body>
</html>
