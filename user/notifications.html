<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Notifications</h2>

    <div style="display: grid; gap: 0.75rem;">
      <div class="card-sinex-hero" style="padding: 1rem;">
        <div style="font-weight: 700; font-size: 0.9rem; color: var(--sinex-teal);">Task Approved 🎉</div>
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted); margin-top: 0.25rem;">Your submission for "Consumer Habits Questionnaire" was approved and $2.00 credited.</div>
        <div style="font-size: 0.7rem; color: var(--sinex-text-muted); margin-top: 0.5rem;">2 hours ago</div>
      </div>

      <div class="card-sinex-hero" style="padding: 1rem;">
        <div style="font-weight: 700; font-size: 0.9rem;">New Task Available</div>
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted); margin-top: 0.25rem;">A new high-yield task "Beta Test Fintech Mobile App" is now active.</div>
        <div style="font-size: 0.7rem; color: var(--sinex-text-muted); margin-top: 0.5rem;">Yesterday</div>
      </div>
    </div>
  </div>
<script src="../assets/js/main.js"></script>
</body>
</html>
