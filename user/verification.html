<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Verification | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="profile.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Profile</a>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h2 style="margin: 0 0 0.5rem 0; font-size: 1.25rem;">KYC Verification</h2>
      <p style="margin: 0 0 1.25rem 0; font-size: 0.8rem; color: var(--sinex-text-muted);">Verify your identity to unlock higher daily withdrawal limits.</p>

      <form action="profile.html">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Document Type</label>
          <select class="sinex-input" required>
            <option value="passport">National ID / NIN</option>
            <option value="license">Driver's License</option>
            <option value="passport">International Passport</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">ID Number</label>
          <input type="text" class="sinex-input" placeholder="Enter ID number" required>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Upload Document Photo</label>
          <input type="file" class="sinex-input" style="padding: 0.5rem;" required>
        </div>

        <button type="submit" class="btn-sinex-primary">Submit Verification Documents →</button>
      </form>
    </div>
  </div>

</body>
</html>
