<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards & Badges | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Achievements & Rewards</h2>

    <div style="display: grid; gap: 1rem;">
      <div class="card-sinex-hero" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
        <span style="font-size: 2rem;">🌟</span>
        <div>
          <div style="font-weight: 700; font-size: 0.95rem;">First 10 Tasks Completed</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Unlocked +$5.00 bonus credit</div>
        </div>
      </div>

      <div class="card-sinex-hero" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem; opacity: 0.6;">
        <span style="font-size: 2rem;">🚀</span>
        <div>
          <div style="font-weight: 700; font-size: 0.95rem;">Power User (50 Tasks)</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Progress: 48 / 50 tasks completed</div>
        </div>
      </div>
    </div>
  </div>
<script src="../assets/js/main.js"></script>
</body>
</html>
