<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">My Task Submissions</h2>

    <!-- Submissions Table/List -->
    <div style="display: grid; gap: 0.75rem;">
      <div class="card-sinex-hero" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-weight: 700; font-size: 0.95rem;">Beta Test Fintech Mobile App</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Submitted today at 10:20 AM</div>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="background: rgba(234, 179, 8, 0.15); color: #eab308; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">UNDER REVIEW</span>
          <span style="font-weight: 800; color: #10b981;">$5.00</span>
        </div>
      </div>

      <div class="card-sinex-hero" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <div style="font-weight: 700; font-size: 0.95rem;">Consumer Habits Questionnaire</div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Submitted yesterday</div>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">APPROVED</span>
          <span style="font-weight: 800; color: #10b981;">$2.00</span>
        </div>
      </div>
    </div>
  </div>

  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 1px solid var(--sinex-border); padding: 0.75rem 0; display: flex; justify-content: space-around; z-index: 100;">
    <a href="dashboard.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">🏠<br>Home</a>
    <a href="tasks.html" style="color: var(--sinex-teal); text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: 700;">📋<br>Tasks</a>
    <a href="wallet.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">💳<br>Wallet</a>
    <a href="profile.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">👤<br>Profile</a>
  </nav>
<script src="../assets/js/main.js"></script>
</body>
</html>
