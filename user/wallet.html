<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">My Wallet</h2>

    <!-- Balance Card -->
    <div class="card-sinex-hero" style="padding: 1.5rem; text-align: center; margin-bottom: 1.25rem;">
      <div style="font-size: 0.85rem; color: var(--sinex-text-muted); margin-bottom: 0.35rem;">Total Balance</div>
      <div style="font-size: 2.25rem; font-weight: 800; color: #ffffff; margin-bottom: 1.25rem;">$124.50</div>
      
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <a href="withdrawals.html" class="btn-sinex-primary" style="padding: 0.6rem 1.25rem; font-size: 0.85rem; text-decoration: none; width: auto;">Withdraw Funds</a>
        <a href="transactions.html" style="border: 1px solid var(--sinex-border); color: #fff; padding: 0.6rem 1.25rem; border-radius: var(--border-radius-md); font-size: 0.85rem; text-decoration: none; font-weight: 700;">History</a>
      </div>
    </div>

    <!-- Earnings Breakdown -->
    <div class="card-sinex-hero" style="padding: 1.25rem;">
      <h3 style="margin: 0 0 1rem 0; font-size: 0.95rem;">Earnings Breakdown</h3>
      <div style="display: grid; gap: 0.75rem; font-size: 0.85rem;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--sinex-border); padding-bottom: 0.5rem;">
          <span style="color: var(--sinex-text-muted);">Completed Tasks</span>
          <span style="font-weight: 700;">$92.50</span>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--sinex-border); padding-bottom: 0.5rem;">
          <span style="color: var(--sinex-text-muted);">Referral Bonuses</span>
          <span style="font-weight: 700;">$32.00</span>
        </div>
      </div>
    </div>
  </div>

  <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: #111827; border-top: 1px solid var(--sinex-border); padding: 0.75rem 0; display: flex; justify-content: space-around; z-index: 100;">
    <a href="dashboard.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">🏠<br>Home</a>
    <a href="tasks.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">📋<br>Tasks</a>
    <a href="wallet.html" style="color: var(--sinex-teal); text-decoration: none; text-align: center; font-size: 0.75rem; font-weight: 700;">💳<br>Wallet</a>
    <a href="profile.html" style="color: var(--sinex-text-muted); text-decoration: none; text-align: center; font-size: 0.75rem;">👤<br>Profile</a>
  </nav>
<script src="../assets/js/main.js"></script>
</body>
</html>
