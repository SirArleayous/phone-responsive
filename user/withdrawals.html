<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Funds | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="wallet.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Wallet</a>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <h2 style="margin: 0 0 1rem 0; font-size: 1.25rem;">Withdraw Earnings</h2>

      <form action="transactions.html">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Select Payment Method</label>
          <select class="sinex-input" required>
            <option value="bank">Bank Transfer</option>
            <option value="crypto">USDT / Crypto Wallet</option>
            <option value="paypal">PayPal</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Amount ($)</label>
          <input type="number" min="10" max="124.50" class="sinex-input" placeholder="Min. $10.00" required>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Account / Wallet Details</label>
          <input type="text" class="sinex-input" placeholder="Account number or wallet address" required>
        </div>

        <button type="submit" class="btn-sinex-primary">Submit Withdrawal Request →</button>
      </form>
    </div>
  </div>
<script src="../assets/js/main.js"></script>
</body>
</html>
