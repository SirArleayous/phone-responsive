<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Analytics | SINEX Investor</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 1000px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="dashboard.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Dashboard</a>

    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Unit Economics & Scalability</h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;">
      <div class="card-sinex-hero" style="padding: 1.25rem;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted); margin-bottom: 0.35rem;">Customer Acquisition Cost (CAC)</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #ffffff;">$2.40</div>
        <span style="font-size: 0.75rem; color: #10b981; font-weight: 700;">Blended across viral referrals</span>
      </div>

      <div class="card-sinex-hero" style="padding: 1.25rem;">
        <div style="font-size: 0.8rem; color: var(--sinex-text-muted); margin-bottom: 0.35rem;">Customer Lifetime Value (LTV)</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: var(--sinex-teal);">$38.20</div>
        <span style="font-size: 0.75rem; color: #10b981; font-weight: 700;">LTV:CAC Ratio = 15.9x</span>
      </div>
    </div>
  </div>

</body>
</html>
