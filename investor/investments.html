<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capital Holdings | SINEX Investor</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="dashboard.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Dashboard</a>

    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Your Shareholding Profile</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
        <div>
          <h3 style="margin: 0 0 0.25rem 0;">Series A Preferred Units</h3>
          <div style="font-size: 0.8rem; color: var(--sinex-text-muted);">Certificate #: SNX-INV-0042</div>
        </div>
        <span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">ACTIVE HOLDING</span>
      </div>

      <div style="border-top: 1px solid var(--sinex-border); padding-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Equity Stake</div>
          <div style="font-size: 1.25rem; font-weight: 800;">8.50%</div>
        </div>
        <div>
          <div style="font-size: 0.75rem; color: var(--sinex-text-muted);">Total Units Held</div>
          <div style="font-size: 1.25rem; font-weight: 800; color: var(--sinex-teal);">850,000</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
