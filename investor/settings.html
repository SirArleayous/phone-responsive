<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Governance Settings | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body style="background: var(--sinex-bg); color: #ffffff; min-height: 100vh; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; padding: 1.25rem 1rem;">
    <a href="dashboard.html" style="color: var(--sinex-teal); text-decoration: none; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;">← Back to Dashboard</a>

    <h2 style="margin: 0 0 1.25rem 0; font-size: 1.25rem; font-weight: 800;">Governance & Account Configurations</h2>

    <div class="card-sinex-hero" style="padding: 1.5rem;">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Dividend Payout Rail Preference</label>
        <select class="sinex-input">
          <option value="wire">Direct USD Wire Transfer</option>
          <option value="usdt">USDT Crypto Settlement (TRC-20)</option>
        </select>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">Quarterly Audited Financial Digest Email</label>
        <select class="sinex-input">
          <option value="enabled">Enabled (Immediate Delivery)</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>

      <button class="btn-sinex-primary" style="width: auto;" onclick="alert('Investor settings saved successfully!');">Save Preferences</button>
    </div>
  </div>

</body>
</html>
